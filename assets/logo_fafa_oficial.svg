<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
            .brand-arch-sub {
                font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
                font-weight: 700;
                font-size: 11px;
                letter-spacing: 4.5px;
                fill: #C89F96;
                text-anchor: middle;
            }
            .brand-main-title {
                font-family: 'Playfair Display', Georgia, serif;
                font-weight: 700;
                font-size: 46px;
                letter-spacing: 2px;
                fill: #A57B72;
                text-anchor: middle;
            }
            .brand-slogan {
                font-family: 'Playfair Display', Georgia, serif;
                font-style: italic;
                font-size: 13px;
                letter-spacing: 0.8px;
                fill: #856158;
                text-anchor: middle;
            }
            .sparkle-icon {
                fill: #C89F96;
            }
        </style>
    </defs>

    <!-- Top Arched Tagline -->
    <text x="210" y="24" class="brand-arch-sub">DOCES PRESENTES</text>

    <!-- Left Sparkle Star -->
    <path d="M 92 56 Q 98 56 98 50 Q 98 56 104 56 Q 98 56 98 62 Q 98 56 92 56 Z" class="sparkle-icon"/>
    
    <!-- Main FAFA Serif Typography -->
    <text x="210" y="68" class="brand-main-title">FAFA</text>

    <!-- Right Sparkle Star -->
    <path d="M 316 56 Q 322 56 322 50 Q 322 56 328 56 Q 322 56 322 62 Q 322 56 316 56 Z" class="sparkle-icon"/>

    <!-- Bottom Slogan -->
    <text x="210" y="94" class="brand-slogan">Afeto, memórias e experiências</text>
</svg>

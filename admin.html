<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Admin • Fafa Doces Presentes</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#360C14">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Admin Stylesheet -->
    <link rel="stylesheet" href="admin.css?v=20260901a">
</head>
<body>

    <!-- PIN Authentication Gate Modal -->
    <div id="pin-modal" class="pin-gate-overlay">
        <div class="pin-card">
            <div class="pin-logo-box">
                <img src="assets/logo_fafa_horizontal.svg" alt="Fafa Doces Presentes" class="pin-logo" onerror="this.onerror=null;this.src='assets/logo.svg';">
            </div>
            <div class="pin-header">
                <h2>Painel Admin</h2>
                <p>Controle rápido de cardápio, preços e disponibilidade</p>
            </div>
            
            <button type="button" class="btn-biometric" id="btn-biometric" onclick="authenticateWithBiometrics()" style="display:none;">
                <i data-lucide="fingerprint" style="width:18px;height:18px;"></i>
                <span>Entrar com Biometria / TouchID</span>
            </button>

            <div class="pin-divider-text">ou digite o PIN</div>

            <div class="pin-display">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>
            <input type="password" id="pin-hidden-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" autofocus autocomplete="off">
            <div class="pin-numpad">
                <button type="button" class="num-btn" onclick="appendPin('1')">1</button>
                <button type="button" class="num-btn" onclick="appendPin('2')">2</button>
                <button type="button" class="num-btn" onclick="appendPin('3')">3</button>
                <button type="button" class="num-btn" onclick="appendPin('4')">4</button>
                <button type="button" class="num-btn" onclick="appendPin('5')">5</button>
                <button type="button" class="num-btn" onclick="appendPin('6')">6</button>
                <button type="button" class="num-btn" onclick="appendPin('7')">7</button>
                <button type="button" class="num-btn" onclick="appendPin('8')">8</button>
                <button type="button" class="num-btn" onclick="appendPin('9')">9</button>
                <button type="button" class="num-btn action" onclick="clearPin()">C</button>
                <button type="button" class="num-btn" onclick="appendPin('0')">0</button>
                <button type="button" class="num-btn action" onclick="submitPin()"><i data-lucide="arrow-right" style="width:20px;height:20px;"></i></button>
            </div>
            <div class="pin-hint">PIN padrão: <strong>1234</strong></div>
        </div>
    </div>

    <!-- Admin Main App Interface (Initially Hidden until PIN is valid) -->
    <div id="admin-app" class="admin-layout" style="display: none;">
        
        <!-- Header Superior Despoluído -->
        <header class="admin-header">
            <div class="admin-container header-row">
                <div class="admin-brand-col">
                    <a href="index.html" class="admin-logo-link" title="Ver cardápio público">
                        <img src="assets/logo_fafa_horizontal.svg" alt="Fafa Doces" class="admin-brand-img" onerror="this.onerror=null;this.src='assets/logo.svg';">
                    </a>
                    <div class="admin-badge-strip">
                        <span class="owner-pill"><i data-lucide="shield-check" style="width:13px;height:13px;"></i> Admin do Dono</span>
                    </div>
                </div>

                <div class="admin-actions-col">
                    <a href="index.html" target="_blank" class="btn-preview-link" title="Abrir cardápio do cliente">
                        <i data-lucide="external-link" style="width:16px;height:16px;"></i>
                        <span class="btn-text">Ver Loja</span>
                    </a>
                    <button type="button" class="btn-primary-add" onclick="openProductModal()" aria-label="Adicionar novo produto">
                        <i data-lucide="plus-circle" style="width:18px;height:18px;"></i>
                        <span>+ Novo Produto</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Faixa de Métricas Rápidas -->
        <section class="admin-metrics-section">
            <div class="admin-container">
                <div class="metrics-grid">
                    <div class="metric-card" onclick="filterAdminCategory('todos')" style="cursor: pointer;" title="Ver todos os itens">
                        <div class="metric-icon-box bg-cocoa">
                            <i data-lucide="package" style="width:20px;height:20px;color:#A26752;"></i>
                        </div>
                        <div class="metric-content">
                            <span class="metric-value" id="stat-total">0</span>
                            <span class="metric-label">Total de Itens</span>
                        </div>
                    </div>

                    <div class="metric-card" onclick="filterAdminCategory('todos')" style="cursor: pointer;" title="Itens no cardápio ativo">
                        <div class="metric-icon-box bg-emerald">
                            <i data-lucide="check-circle-2" style="width:20px;height:20px;color:#10B981;"></i>
                        </div>
                        <div class="metric-content">
                            <span class="metric-value text-emerald" id="stat-active">0</span>
                            <span class="metric-label">No Cardápio</span>
                        </div>
                    </div>

                    <div class="metric-card metric-clickable" onclick="filterAdminCategory('pausados')" style="cursor: pointer;" title="Clique para filtrar itens pausados / esgotados">
                        <div class="metric-icon-box bg-amber">
                            <i data-lucide="eye-off" style="width:20px;height:20px;color:#EE5244;"></i>
                        </div>
                        <div class="metric-content">
                            <span class="metric-value text-amber" id="stat-hidden">0</span>
                            <span class="metric-label">Pausados / Esgotados</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Barra de Busca & Filtros com Suporte a Pausados -->
        <section class="admin-toolbar-section">
            <div class="admin-container">
                <div class="search-bar-wrap">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="admin-search-input" class="search-input" placeholder="Buscar doce por nome, descrição ou valor..." oninput="handleAdminSearch(event)">
                    <button type="button" class="btn-clear-search" id="btn-clear-search" onclick="clearSearch()" style="display:none;">
                        <i data-lucide="x" style="width:16px;height:16px;"></i>
                    </button>
                </div>

                <!-- Categorias com Filtro Pausados Dinâmico -->
                <div class="category-scroll-pills">
                    <button class="cat-pill active" data-category="todos" onclick="filterAdminCategory('todos')">
                        <i data-lucide="grid" style="width:14px;height:14px;"></i>
                        <span>Todos os Itens</span>
                    </button>
                    <!-- Filtro Dinâmico de Itens Pausados (Aparece quando houver itens desabilitados) -->
                    <button class="cat-pill pill-paused" id="pill-filter-paused" data-category="pausados" onclick="filterAdminCategory('pausados')" style="display: none; background: #FFF2F0; border-color: rgba(238, 82, 68, 0.4); color: var(--accent-coral);">
                        <i data-lucide="eye-off" style="width:14px;height:14px;"></i>
                        <span>Pausados (<span id="paused-count-pill">0</span>)</span>
                    </button>
                    <button class="cat-pill" data-category="promocoes" onclick="filterAdminCategory('promocoes')">
                        <i data-lucide="sparkles" style="width:14px;height:14px;"></i>
                        <span>Mais Vendidos &amp; Promoções</span>
                    </button>
                    <button class="cat-pill" data-category="cookies" onclick="filterAdminCategory('cookies')">
                        <i data-lucide="cookie" style="width:14px;height:14px;"></i>
                        <span>Cookies &amp; Viciantes</span>
                    </button>
                    <button class="cat-pill" data-category="tortas" onclick="filterAdminCategory('tortas')">
                        <i data-lucide="cake" style="width:14px;height:14px;"></i>
                        <span>Bolos &amp; Vitrine</span>
                    </button>
                    <button class="cat-pill" data-category="presentes" onclick="filterAdminCategory('presentes')">
                        <i data-lucide="gift" style="width:14px;height:14px;"></i>
                        <span>Boxes &amp; Presentes</span>
                    </button>
                    <button class="cat-pill" data-category="congelados" onclick="filterAdminCategory('congelados')">
                        <i data-lucide="snowflake" style="width:14px;height:14px;"></i>
                        <span>Fafa Congelados</span>
                    </button>
                    <button class="cat-pill" data-category="salgados" onclick="filterAdminCategory('salgados')">
                        <i data-lucide="croissant" style="width:14px;height:14px;"></i>
                        <span>Quiches &amp; Salgados</span>
                    </button>
                    <button class="cat-pill" data-category="bebidas" onclick="filterAdminCategory('bebidas')">
                        <i data-lucide="coffee" style="width:14px;height:14px;"></i>
                        <span>Cafés &amp; Bebidas</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Lista de Produtos para a Mão do Dono -->
        <main class="admin-main">
            <div class="admin-container">
                <div class="admin-section-header">
                    <h2 id="current-category-title">Todos os Produtos</h2>
                    <span class="count-badge" id="category-items-count">45 itens</span>
                </div>

                <div class="product-admin-list" id="admin-product-list">
                    <!-- Preenchido via JavaScript -->
                </div>
            </div>
        </main>

        <!-- Botão Flutuante Rápido + Novo Produto no Mobile -->
        <button type="button" class="mobile-float-add" onclick="openProductModal()" aria-label="Adicionar Doce">
            <i data-lucide="plus" style="width:24px;height:24px;"></i>
        </button>
    </div>

    <!-- Modal: Adicionar / Editar Produto Completo -->
    <div id="product-modal" class="modal-overlay" style="display: none;" onclick="closeProductModalOnBackdrop(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-form-title">Cadastrar Novo Produto</h3>
                <button type="button" class="btn-close-modal" onclick="closeProductModal()">
                    <i data-lucide="x" style="width:20px;height:20px;"></i>
                </button>
            </div>
            
            <form id="product-form" onsubmit="handleProductFormSubmit(event)">
                <input type="hidden" id="form-prod-id">

                <div class="form-group">
                    <label for="form-prod-name">Nome do Produto / Doce *</label>
                    <input type="text" id="form-prod-name" required placeholder="Ex: Cookie Red Velvet com Nutella" class="form-input">
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="form-prod-category">Categoria Principal *</label>
                        <select id="form-prod-category" required class="form-select">
                            <option value="promocoes">⭐ Mais Vendidos & Promoções</option>
                            <option value="cookies" selected>🍪 Cookies & Viciantes</option>
                            <option value="tortas">🎂 Bolos & Vitrine</option>
                            <option value="presentes">🎁 Boxes & Presentes</option>
                            <option value="congelados">❄️ Fafa Congelados</option>
                            <option value="salgados">🥐 Quiches & Salgados</option>
                            <option value="bebidas">☕ Cafés & Bebidas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="form-prod-price">Preço de Venda (R$) *</label>
                        <div class="price-input-wrap">
                            <span class="currency-prefix">R$</span>
                            <input type="number" id="form-prod-price" required step="0.01" min="0" placeholder="12,50" class="form-input price-field">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-prod-desc">Descrição / Ingredientes / Rendimento</label>
                    <textarea id="form-prod-desc" rows="3" placeholder="Massa fofinha com cacau nobre, recheio artesanal..." class="form-textarea"></textarea>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="form-prod-badge">Selo / Destaque Visual (Opcional)</label>
                        <select id="form-prod-badge" class="form-select">
                            <option value="">Sem Selo</option>
                            <option value="Mais Vendido ⭐">⭐ Mais Vendido</option>
                            <option value="Doces Presentes 🎁">🎁 Doces Presentes</option>
                            <option value="Fafa na sua Casa ❄️">❄️ Fafa na sua Casa</option>
                            <option value="Receita Relâmpago ⚡">⚡ Receita Relâmpago</option>
                            <option value="Pâtisserie do Chef 👑">👑 Pâtisserie do Chef</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="form-prod-img">Foto do Produto (Caminho ou URL)</label>
                        <input type="text" id="form-prod-img" placeholder="assets/produtos/prod_12314145.jpg" class="form-input">
                    </div>
                </div>

                <div class="form-checkbox-row">
                    <label class="custom-checkbox-label">
                        <input type="checkbox" id="form-prod-visible" checked>
                        <span class="checkbox-box"></span>
                        <span class="checkbox-text">Produto ativo e visível no cardápio</span>
                    </label>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeProductModal()">Cancelar</button>
                    <button type="submit" class="btn-save-submit">
                        <i data-lucide="check" style="width:18px;height:18px;"></i>
                        <span>Salvar Produto</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Box -->
    <div id="admin-toast" class="admin-toast-box"></div>

    <!-- Admin Logic Scripts -->
    <script src="app.js"></script>
    <script src="admin.js"></script>
</body>
</html>
